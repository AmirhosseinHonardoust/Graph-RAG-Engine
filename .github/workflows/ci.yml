name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff black mypy

      - name: Ruff (lint + import order)
        run: ruff check backend graph ingest evaluation ui tests run_backend.py

      - name: Black (format check)
        run: black --check backend graph ingest evaluation ui tests run_backend.py

      - name: Mypy (type check)
        run: mypy backend graph ingest evaluation ui run_backend.py

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2-v1

      - name: Pre-download embedding model (retry on transient HF errors)
        run: |
          for i in 1 2 3 4 5; do
            if python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"; then
              echo "Embedding model is available."
              exit 0
            fi
            echo "Model download attempt $i failed; retrying in $((i * 20))s..."
            sleep $((i * 20))
          done
          echo "Could not download the embedding model after several attempts."
          exit 1

      - name: Compile source files
        run: |
          python -m compileall backend graph ingest ui evaluation tests run_backend.py

      - name: Rebuild retrieval index
        run: |
          python -m ingest.ingest_docs

      - name: Run retrieval evaluation
        run: |
          python -m evaluation.evaluate_retrieval \
            --queries evaluation/golden_queries.json \
            --output evaluation/results/retrieval_eval.json \
            --k 3 \
            --base-k 8 \
            --top-n 6 \
            --expand-hops 1 \
            --fail-under evaluation/baseline.json

      - name: Run unit tests
        env:
          RETRIEVAL_EVAL_REPORT: evaluation/results/retrieval_eval.json
        run: |
          python -m unittest discover -s tests -v

      - name: Verify generated retrieval artifacts
        run: |
          test -f data/index/faiss.index
          test -f data/index/vectors.npy
          test -f data/index/docs.json
          test -f data/index/chunks.json
          test -f data/index/graph.json
          test -f evaluation/results/retrieval_eval.json

      - name: Upload retrieval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graph-rag-retrieval-artifacts-python-${{ matrix.python-version }}
          path: |
            data/index/
            evaluation/results/
