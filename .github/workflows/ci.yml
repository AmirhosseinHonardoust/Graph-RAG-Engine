name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: env/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r env/requirements.txt

      - name: Compile source files
        run: |
          python -m compileall backend graph ingest ui evaluation tests run_backend.py

      - name: Rebuild retrieval index
        run: |
          python -m ingest.ingest_docs

      - name: Run retrieval evaluation
        run: |
          python -m evaluation.evaluate_retrieval \
            --queries evaluation/golden_queries.json \
            --output evaluation/results/retrieval_eval.json \
            --k 3 \
            --base-k 8 \
            --top-n 6 \
            --expand-hops 1

      - name: Run unit tests
        env:
          RETRIEVAL_EVAL_REPORT: evaluation/results/retrieval_eval.json
        run: |
          python -m unittest discover -s tests -v

      - name: Verify generated retrieval artifacts
        run: |
          test -f data/index/faiss.index
          test -f data/index/vectors.npy
          test -f data/index/docs.pkl
          test -f data/index/chunks.pkl
          test -f data/index/graph.pkl
          test -f evaluation/results/retrieval_eval.json

      - name: Upload retrieval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graph-rag-retrieval-artifacts-python-${{ matrix.python-version }}
          path: |
            data/index/
            evaluation/results/
