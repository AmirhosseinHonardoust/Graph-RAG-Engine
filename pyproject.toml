# Tooling configuration for Graph-RAG-Engine.
#
# Tooling-only for now: this configures linting, formatting, and type checking
# without changing how the project is imported or installed. Packaging is a
# separate, later change.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes
# I:   import sorting
# B:   flake8-bugbear (likely bugs)
# SIM: flake8-simplify
# UP:  pyupgrade
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests prepend the repo root to sys.path before importing project modules,
# which trips E402 (import not at top). This is removed once the project is
# packaged and the shim is no longer needed.
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
# The project uses a flat multi-package layout (backend/, graph/, ingest/, ...)
# without an installed package, so mypy needs the repo root as the base.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# faiss, sentence-transformers, streamlit, and uvicorn do not ship type stubs,
# so their imports are treated as untyped rather than failing the type check.
ignore_missing_imports = true
warn_redundant_casts = true
